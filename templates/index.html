
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposals.ai - AI Proposal Generator for Freelancers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs font-semibold">
                <i class="fa-solid me-1 fa-rocket"></i> Early Beta Access 1.0
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
                Proposals.ai
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Turn client job posts into high-converting proposals in seconds.</p>
        </header>

        <!-- Main Form Card -->
        <div class="glass-card rounded-2xl p-5 md:p-6 shadow-2xl space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">
                    <i class="fa-solid fa-briefcase text-indigo-400 mr-1"></i> Upwork / Client Job Description
                </label>
                <textarea id="jobDescription" rows="6" 
                    class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                    placeholder="Paste the full job post here..."></textarea>
            </div>

            <!-- Tone Selector & Actions -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Writing Style / Tone</label>
                    <select id="toneSelect" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Professional & Direct">🎯 Professional & Direct (Best Overall)</option>
                        <option value="Short & Punchy (Bullet Points)">⚡ Short & Punchy (High Scanability)</option>
                        <option value="Problem Solving & Technical">🛠️ Deep Technical & Solution-Focused</option>
                        <option value="Casual & Friendly">💬 Casual & Friendly Conversation</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="generateBtn" onclick="generateProposal()" 
                        class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-2.5 rounded-xl transition duration-200 shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Proposal
                    </button>
                </div>
            </div>
        </div>

        <!-- Output Section -->
        <div id="outputSection" class="hidden glass-card rounded-2xl p-5 md:p-6 shadow-2xl space-y-4 border-indigo-500/30">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <h3 class="font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-circle-check text-emerald-400"></i> Optimized Pitch Ready
                </h3>
                <button onclick="copyToClipboard()" class="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                    <i class="fa-regular fa-copy"></i> <span id="copyBtnText">Copy Text</span>
                </button>
            </div>
            
            <div id="proposalOutput" class="text-sm text-slate-300 leading-relaxed space-y-2"></div>
        </div>

    </div>

    <script>
        async function generateProposal() {
            const jobDesc = document.getElementById('jobDescription').value.trim();
            const tone = document.getElementById('toneSelect').value;
            const btn = document.getElementById('generateBtn');
            const outputSec = document.getElementById('outputSection');
            const outputDiv = document.getElementById('proposalOutput');

            if (!jobDesc) {
                alert('Please paste a job description first!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Writing Winning Pitch...`;

            try {
                const res = await fetch('/generate-proposal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_description: jobDesc, tone: tone })
                });

                const data = await res.json();
                if (data.success) {
                    outputDiv.innerHTML = marked.parse(data.proposal);
                    outputSec.classList.remove('hidden');
                    outputSec.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Something went wrong. Please check your internet or API key.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Generate Proposal`;
            }
        }

        function copyToClipboard() {
            const outputText = document.getElementById('proposalOutput').innerText;
            navigator.clipboard.writeText(outputText).then(() => {
                const btnText = document.getElementById('copyBtnText');
                btnText.innerText = 'Copied!';
                setTimeout(() => btnText.innerText = 'Copy Text', 2000);
            });
        }
    </script>
</body>
</html>
